# main ブランチを Notion 同期 → ビルド → 本番（asnomi.com）へデプロイする。
#
# ビルド（同期・0件ガード・Hugo）は build-site.yml（devと共通）。deployジョブは `environment: prod`。
# prod Environment は承認者なし（2026-10-28決定）。本番に出る入口を dev → main のマージに一本化し、そのマージを実質の承認とする。
# OIDCの信頼ポリシーは prod Environment の sub に限定される（トラックD設計書9.2）。
# AWSの値（S3_BUCKET_NAME / CLOUDFRONT_DISTRIBUTION_ID / AWS_DEPLOY_ROLE_ARN）は prod Environment の Variables から読む。
name: deploy-prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'S3へデプロイする（OFFにすると、同期・0件ガード・ビルドの確認だけ行う）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false # デプロイ(S3 sync)の途中打ち切りを避け、後続は待機させる

jobs:
  build:
    uses: ./.github/workflows/build-site.yml
    with:
      base_url: https://asnomi.com/
    secrets: inherit

  deploy:
    needs: build
    # Environment prod の Deployment branches は main のみ。main 以外の ref ではデプロイしない
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod # 承認者なし。main に入った内容は承認なしで本番へ出る（承認は dev → main のマージ）
    permissions:
      id-token: write
      contents: read
      actions: read # 前回の記録（Artifact）の取得
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      # 旧サイトのパスを現行バケットへ振り分けている間、Hugoが出力してはいけないパス（空白区切り）。
      # 振り分けを止めた後（トラックD PR #61 の apply 後）は、空にする。空のときは確認を行わない。
      LEGACY_PATHS: contents img hyouhon1422 style favicon.ico discography.html biography.html
    steps:
      # Environment変数が未登録だと、同名のリポジトリ変数（= devの値）にフォールバックする。
      # その状態で本番ビルドをdevのバケットへ流さないよう、値が揃っていて dev のものでないことを確認する。
      - name: デプロイ先の確認
        run: |
          for name in AWS_DEPLOY_ROLE_ARN S3_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::prod Environment の Variables ${name} が未設定です"
              exit 1
            fi
            case "$value" in
              *dev*)
                echo "::error::${name} が dev 用の値のようです。prod Environment の Variables を確認してください"
                exit 1
                ;;
            esac
          done

      # 同梱のアクション・スクリプト（照合・記録）を使うため、必要な部分だけ取得する
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public/

      # 本番のCloudFrontは、旧サイトのパスを現行バケット（2つ目のオリジン）へ振り分ける（トラックD設計書9章）。
      # Hugoがこれらのパスにファイルを出力すると、アップロードはされても表示されないため、出力されていたら止める。
      # 旧ページを新サイトのページへ置き換えるときは、トラックD側で振り分けからそのパスを外してから、LEGACY_PATHS も更新する。
      # 振り分けを止めた後は LEGACY_PATHS を空にする（空のときは何もせず成功する）。
      - name: 旧サイト用パスとの重複確認
        run: |
          if [ -z "${LEGACY_PATHS// /}" ]; then
            echo "LEGACY_PATHS が空のため、旧サイト用パスの重複確認は行いません"
            exit 0
          fi
          conflict=0
          for p in ${LEGACY_PATHS}; do
            if [ -e "public/$p" ]; then
              echo "::error::public/$p が出力されています。旧サイト用の振り分け対象パスのため、本番では表示されません"
              conflict=1
            fi
          done
          exit $conflict

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      # デプロイの前に、バケットの今の状態を前回のデプロイの記録と照合する（Issue #45）。
      # 差分があっても止めず、このデプロイで正しい内容に戻し、最後にジョブを失敗させる（失敗のメールで気づけるようにする）。
      - name: デプロイ前の照合（改ざん検知）
        id: verify
        uses: ./.github/actions/bucket-verify
        with:
          bucket: ${{ env.S3_BUCKET_NAME }}
          artifact-name: deploy-manifest-prod

      - name: Sync to S3
        run: aws s3 sync public/ "s3://${S3_BUCKET_NAME}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"

      # デプロイ後のバケットのファイル一覧とハッシュ値を記録する（GitHubのArtifact。S3には置かない）
      - name: デプロイ後の記録
        uses: ./.github/actions/bucket-record
        with:
          bucket: ${{ env.S3_BUCKET_NAME }}
          artifact-name: deploy-manifest-prod

      - name: 改ざんの検知結果
        if: steps.verify.outputs.drift == 'true'
        run: |
          echo "::error::前回のデプロイ以降、デプロイ以外の変更がバケットにありました。このデプロイで正しい内容に戻しています。詳細は「デプロイ前の照合」ステップのログを確認してください"
          exit 1
