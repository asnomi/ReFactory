# 定期実行。Notionの更新（と、未来日付のニュースの公開）をサイトに反映するため、6時間おきにデプロイを起動する。
#
# `schedule` は既定ブランチ（dev）のワークフローしか動かず、実行時のrefも dev になる。
# dev 向けはそれで足りるが、prod は main をビルドし、prod Environment（Deployment branches = main のみ）
# でしかデプロイできない。そのため、このワークフローは何もビルドせず、
# 各デプロイワークフローを正しいrefで workflow_dispatch するだけにしている。
#
# - dev : 常に起動（ref = dev）
# - prod: リポジトリ変数 SCHEDULE_DEPLOY_PROD が 'true' のときだけ起動（ref = main）。リリース後にユーザーが 'true' にする。
#         prod Environment は承認者なし（2026-10-28決定）のため、起動すると承認待ちなしでデプロイされる。止めるときは変数を false にする。
#         main に deploy-prod.yml が入る前に 'true' にすると、このステップだけ失敗する。
name: scheduled-deploy

on:
  schedule:
    - cron: '17 */6 * * *' # UTC。6時間おき（毎正時の混雑を避けて17分にずらす）
  workflow_dispatch:

permissions:
  actions: write # gh workflow run（workflow_dispatch）に必要
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: dev のデプロイを起動
        run: gh workflow run deploy-dev.yml --ref dev -f deploy=true

      - name: prod のデプロイを起動
        if: vars.SCHEDULE_DEPLOY_PROD == 'true'
        run: gh workflow run deploy-prod.yml --ref main -f deploy=true
