# 定期実行。Notionの更新（と、未来日付のニュースの公開）をサイトに反映するため、6時間おきにデプロイを起動する。
#
# `schedule` は既定ブランチ（main）のワークフローしか動かず、実行時のrefも main になる。
# そのまま deploy-dev を schedule にすると dev ではなく main がビルドされ、dev Environment
# （Deployment branches = dev のみ）にも弾かれる。そのため、このワークフローは何もビルドせず、
# 各デプロイワークフローを正しいrefで workflow_dispatch するだけにしている。
#
# - dev : 常に起動（ref = dev）
# - prod: リポジトリ変数 SCHEDULE_DEPLOY_PROD が 'true' のときだけ起動（ref = main）。リリース後に 'true' にする。
#         prod の deploy ジョブは prod Environment の承認待ちになる（承認されるまでデプロイされない）。
name: scheduled-deploy

on:
  schedule:
    - cron: '17 */6 * * *' # UTC。6時間おき（毎正時の混雑を避けて17分にずらす）
  workflow_dispatch:

permissions:
  actions: write # gh workflow run（workflow_dispatch）に必要
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: dev のデプロイを起動
        run: gh workflow run deploy-dev.yml --ref dev -f deploy=true

      - name: prod のデプロイを起動
        if: vars.SCHEDULE_DEPLOY_PROD == 'true'
        run: gh workflow run deploy-prod.yml --ref main -f deploy=true
