#################### default parameters ################################
# favicon
favicon = "images/favicon.png"
# logo
logo = ""
# use `px` or `x` with logo_width, example: "100px".
# Note: logo_width is not work with .svg file
logo_width = ""
# if logo_webp set false, will not generate WEBP version of logo | default is true
logo_webp = true
# logo text will only show when logo is missing.
logo_text = "asnomi studio"

# 検索エンジンへのインデックスを許可するホスト名（baseURLのホスト部分）。
# ここに無いホスト（dev.asnomi.com / localhost 等）のビルドは noindex + robots.txt全拒否になる。
# 本番公開時のbaseURLを変える場合は、ここも合わせて更新すること。
indexableHosts = ["asnomi.com", "www.asnomi.com"]

# purgeCSS
purge_css = true

# contact form action
contact_form_action = "#" # フッターのお問い合わせフォームの送信先（Formspree等のフォームサービスのURL）。"#"のままだと送信しても何も送られない。公開前に要設定。例: https://formspree.io/f/xxxxxxxx

# google tag manager, see https://developers.google.com/tag-manager/
google_adsense = "" # example: ca-pub-xxxxxxxxxxxxxxxx
google_tag_manager = "" # example: G-XXXXXXXXXX

# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>"
custom_script = ""

# Author
author = "asnomi"

# copyright
# フッターのコピーライト表記: ©{copyright_since}-{ビルド年} {copyright_holder}（終了年はビルド時に自動で更新される）
copyright_since = 2012
copyright_holder = "asnomi studio"
theme_copyright = false

# Preloader
[preloader]
# 読み込み中アニメーション（全画面のローディング画像）。ページ表示時のディゾルブ（custom.scss）と重なるため無効化
enable = false
preloader = "images/preloader.gif" # use jpg, png, svg or gif format.

# contact info（モック用ダミー。実データはNotion側で管理予定）
[contact_info]
address = ""
email = "asnomi.com@gmail.com"
mobile = ""

# Crisp Chat
[crisp_chat]
crisp_website_id = "9aa449e1-9999-422a-938f-8567982eec6d" # replace this code with yours
enable = false 
# Check this video tutorial to get your crisp website ID - https://www.youtube.com/watch?v=nW5UX6iVdFc

# Valine Comment
[valine_comment]
appId = "" # replace this code with yours [ex: QGzwQXOqs5JOhN4RGPOkR2mR-MdYXbMMI]
appKey = "" # replace this code with yours [ex: WBmoGyJtbqUswvfLh6L8iEBr]
enable = false 
# language = "change language translation from `i18n`"
avatar = "" # see : https://valine.js.org/en/avatar.html
enableQQ = false # https://valine.js.org/en/configuration.html#enableQQ
highlight = true # Code highlighting
pageSize = 10 # will show 10 comments per page
recordIP = true # Record reviewer IP.
visitor = true 
# serverURLs = "" # https://leancloud.your_website.com
# Check Valine's official documentation here - https://valine.js.org/en/configuration.html

# seo meta data for OpenGraph / Twitter Card
[metadata]
author = "asnomi"
description = "asnomi studioのポートフォリオサイト"
image = "images/ogp.jpg" # OGP/Twitterカードの既定画像（static/images/ogp.jpg）。個別の画像を持たないページで使われる
keywords = ["アイスノミ", "asnomi", "あすのみ", "asnomi studio"]

# matomo tracking: see https://matomo.org/
[matomo]
enable = false 
id = "" # your matomo id
url = "" # your matomo url

# baidu analytics: see https://tongji.baidu.com/
[baidu]
analytics_id = "" # Your ID
enable = false 

# plausible analytics: see https://plausible.io/
[plausible]
domain = "" # yourdomain.com
enable = false 

# counter analytics: see https://counter.dev/setup.html
[counter]
enable = false 
username = "" # your username

# site verifications
[site_verification]
baidu = "" # Your verification code
bing = "" # Your verification code
facebook = "" # Your verification code
google = "" # Your verification code
mastodon = "" # Your verification code

# google map
[google_map]
enable = false
embed_url = "" # replace this code with yours (APIキーはコミットしないこと。本実装時はGitHub Secrets等で管理)

# cookies
[cookies]
enable = false
expire_days = 2
button = "I Accept"
content = "This site uses cookies. By continuing to use this website, you agree to their use."


############################# social site ########################
# 表示順＝ヒーロー・お問い合わせページでの並び順。
# 各項目: title（表示名）, link（URL）, icon（Themifyアイコンのクラス）または badge（アイコンが無い場合の丸囲み文字）
# Themifyアイコン一覧: https://themify.me/themify-icons （SoundCloud/Pixiv/はてな/TuneCore/Xは無いためbadgeで代用）
# 項目の追加・削除・並べ替えはこのブロックだけで完結する（テンプレート側の変更は不要）。
[[social]]
title = "X"
link = "https://x.com/asnomi_com"
badge = "X"

[[social]]
title = "Instagram"
link = "https://www.instagram.com/asnomi_com/"
icon = "ti-instagram"

[[social]]
title = "YouTube"
link = "https://www.youtube.com/@asnomi_com"
icon = "ti-youtube"

[[social]]
title = "SoundCloud"
link = "https://soundcloud.com/asnomi_studio"
badge = "SC"

[[social]]
title = "はてなブログ"
link = "https://asnomi.hatenablog.com/"
badge = "B"

[[social]]
title = "Pixiv"
link = "https://www.pixiv.net/users/1591078"
badge = "P"

[[social]]
title = "TuneCore Japan"
link = "https://www.tunecore.co.jp/artists/asnomi"
badge = "TC"
